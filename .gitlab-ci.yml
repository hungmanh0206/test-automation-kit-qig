# GitLab CI — bản tương đương .github/workflows (dùng GitHub thì xoá file này, và ngược lại).
# static: mỗi push/MR (không secret). integration + regression: manual/scheduled.
# Secrets khai ở Settings → CI/CD → Variables (masked/protected): BACKLOG_*, AIO_API_TOKEN.

stages:
  - static
  - integration
  - regression
  - report

# ---- Static / quality check (mỗi push & MR, không secret, không UAT) ----
static-check:
  stage: static
  image: node:20
  variables:
    # static-check KHÔNG cần lịch sử: `git ls-files` (json:check · ci:scope · secret:scan) chạy đúng trên
    # shallow clone. Giữ 20 commit thay vì 1 để `git log`/`git diff` trong gate còn chỗ so nếu cần.
    GIT_DEPTH: "20"
  script:
    - |
      # ĐO THỜI GIAN TỪNG BƯỚC ngay trong trace. Lý do: job này mất 478-589s trong khi tổng các bước gate
      # đo ở máy chỉ ~160s — phần còn lại là clone/npm ci/docker prepare, và không ai thấy được nếu trace
      # chỉ in log của từng lệnh. Có số đo trong trace thì lần sau khỏi phải dựng container đo lại.
      t() { n="$1"; shift; s=$(date +%s); "$@"; c=$?; e=$(date +%s); printf "[time] %-24s %ss (exit %s)\n" "$n" "$((e-s))" "$c"; return $c; }
      set -e
      t "npm ci" npm ci --prefer-offline --no-audit --no-fund
      t "preflight" node scripts/qa/preflight_gate.js --mode generic
      t "node --check js" sh -c 'find scripts -name "*.js" -print0 | xargs -0 -n1 node --check'
      t "node --check mjs" sh -c 'find scripts -name "*.mjs" -print0 | xargs -0 -n1 node --check'
      t "json:check" npm run json:check
      t "ci:scope" npm run ci:scope
      t "gate:policy" npm run gate:policy
      t "gates:index" npm run gates:index:check
      t "skills:index" npm run skills:index:check
      # Trang docs/library/ + tài liệu hướng dẫn là lớp DẪN XUẤT. Trước đây chỉ chạy khi có người
      # nhớ gõ lệnh, tức là chưa gác cổng. Rẻ và tất định: chỉ đọc file trong repo.
      t "library:drift" npm run library:drift
      t "course:maturity:check" npm run course:maturity:check
      t "course:numbers" npm run course:numbers
      t "rule:toc" npm run rule -- --check
      t "secret:scan" npm run secret:scan
      # KHÔNG có bước audit ở job này nữa (04/09/2026). Hai lần cắt, hai lý do khác nhau:
      #   ① `npm audit` trần bỏ trước đó: 74s để lấy CÙNG dữ liệu registry với `audit:ci`, mà chỉ IN advisory.
      #   ② `audit:ci` chuyển sang job `audit` riêng: đo 421s/451s toàn job, và không ổn định (71->198->421s).
      # Bên CHẶN ở high/critical giờ là job `audit` — xem khối của nó để biết khi nào nó chạy.
      t "lint" npm run lint
      t "typecheck" npm run typecheck
      t "dashboard" npm run dashboard
      t "risk" npm run risk
    - 'if node scripts/qa/security_check.js --catalog tests/fixtures/minimal_ui_catalog.json; then echo "security guard PHAI tu choi khi thieu --confirm-nonprod"; exit 1; else echo "security guard OK"; fi'

# ---- Audit dependency: TÁCH RIÊNG vì nó chiếm 93% thời gian gate ----
# ĐO 04/09/2026 (trace job 14185): audit:ci = 421s / 451s toàn job; 12 gate còn lại cộng lại 5s,
# npm ci 15s, overhead ngoài các bước ~10s. Và nó KHÔNG ổn định: 71s -> 198s -> 421s giữa các lượt,
# vì `npm audit` hỏi registry qua mạng của máy chạy runner. Một bước có thời lượng ta không kiểm soát
# được thì không nên nằm trên đường tới hạn của MỌI push.
#
# Đánh đổi đã cân: bỏ audit khỏi push thường thì CVE mới công bố cho dep KHÔNG đổi sẽ biết muộn hơn.
# Bù bằng hai nhánh chạy dưới đây — scheduled (nightly) vẫn quét đủ, nên độ trễ tối đa là 1 ngày,
# và `release.yml` đã chạy audit:ci trước mỗi lần phát hành.
audit:
  stage: static
  image: node:20
  variables:
    GIT_DEPTH: "20"
  # `timeout` là bắt buộc, không phải cho đẹp: runner đang chạy concurrent=1, nên một lượt audit treo
  # sẽ chặn MỌI job khác của project. audit_ci.js coi lỗi hạ tầng là không-chặn (exit 0) nên hết giờ
  # cũng không thành đỏ oan.
  timeout: 12m
  rules:
    # Lockfile/manifest đổi = bề mặt dependency đổi ⇒ phải audit ngay và ĐƯỢC chặn.
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - package-lock.json
        - package.json
    # Nightly: bắt CVE mới công bố cho dep không đổi — chính là lỗ mà việc tách job tạo ra.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
  script:
    # KHÔNG cần `npm ci` — và đây KHÔNG chỉ là tiết kiệm 15s như tôi ghi lúc đầu. Đo trên CI 07/09/2026
    # (job 14202): audit chạy 1,3 GIÂY và ra ĐÚNG cùng kết quả (low 0 · moderate 3 · high 0 · critical 0).
    # Trong khi cũng lệnh đó nằm trong static-check — tức SAU `npm ci` — mất 421s (job 14185).
    # Nguyên nhân: có `node_modules` thì `npm audit` duyệt cây ĐÃ CÀI; không có thì nó hỏi bulk advisory
    # từ lockfile, một request. Nên thứ chậm chưa bao giờ là audit, mà là audit-sau-khi-đã-install.
    # Phụ thêm: gỡ một kiểu đỏ oan — audit không còn phụ thuộc việc install thành công.
    - npm run audit:ci


# ---- Integration check (MANUAL, dry-run — KHÔNG log bug thật) ----
integration-check:
  stage: integration
  image: node:20
  # Job gọi Backlog/AIO/Figma THẬT (chỉ GET, không ghi). Creds đọc từ
  # scripts/integrations/backlog/.env — file KHÔNG track, nên container CI KHÔNG có nó.
  # ⇒ Không khai biến CI thì job đỏ CHẮC CHẮN ("thiếu cấu hình bắt buộc", exit 1 sau ~30s).
  # Một nút luôn-đỏ dạy người ta bỏ qua CI, nên job chỉ HIỆN khi thật sự có creds.
  # Muốn bật: GitLab > Settings > CI/CD > Variables (masked) — BACKLOG_BASE_URL, BACKLOG_API_KEY,
  # BACKLOG_PROJECT_KEY, AIO_API_TOKEN, FIGMA_API_KEY.
  rules:
    - if: '$BACKLOG_API_KEY && $AIO_API_TOKEN'
      when: manual
      allow_failure: true          # THƯỚC ĐO kết nối, không phải cổng chặn merge
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run integration:check:live

# ---- Live regression (MANUAL hoặc scheduled — KHÔNG mỗi push; hit UAT) ----
regression:
  stage: regression
  image: mcr.microsoft.com/playwright:v1.60.0-noble   # đổi tag khớp @playwright/test trong package.json
  # Chỉ chạy khi scheduled (nightly) hoặc khi bấm "Run pipeline" trên UI (source=web).
  # KHÔNG chạy/khối trên push thường → push chỉ có static-check.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  parallel: 4
  variables:
    PROJECT_OUTPUT_DIR: "outputs/ci"          # playwright.config THROW nếu thiếu 2 biến này
    TASK_KEY: "CI-REGRESSION"
    RUN_ID: "ci-$CI_PIPELINE_ID-$CI_NODE_INDEX"
    ALLOW_EMPTY: "1"                          # suite chung chưa promote spec → rỗng hợp lệ, gate GHI NO_TESTS (F6 xong thì bỏ)
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npx playwright install chromium webkit
    # F1 — chống false-green: đếm test trước; NO_TESTS được GHI RÕ thay vì báo PASSED giả.
    # Phạm vi từ `.agent/config/ci_scope.json` (1 nguồn). Gate `ci:scope` chặn nếu ở đây còn lệnh trần.
    - export SCOPE="$(npm run -s ci:scope -- --print-nightly)"; echo "scope = $SCOPE"
    - node scripts/qa/test_inventory_gate.js --out inventory.json -- $SCOPE
    - |
      STATE=$(node -e "try{process.stdout.write(JSON.parse(require('fs').readFileSync('inventory.json','utf8')).state)}catch(e){process.stdout.write('INFRA_FAILURE')}")
      echo "inventory state = $STATE"
      if [ "$STATE" = "HAS_TESTS" ]; then
        npx playwright test $SCOPE --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL --reporter=blob --pass-with-no-tests
      elif [ "$STATE" = "NO_TESTS" ]; then
        echo "NO_TESTS_EXECUTED — suite regression chung chua co spec promoted. KHONG phai PASSED."
      else
        echo "INFRA_FAILURE - playwright/config loi"; exit 1
      fi
  artifacts:
    when: always
    paths: [blob-report/]
    expire_in: 1 week

# ---- Cross-browser lane (MANUAL — Firefox/WebKit) ----
# Vì `project` trong Playwright = NHÂN BẢN suite (không chia việc), cross-browser để LÀN RIÊNG thay vì
# nhét vào lane regression → không nhân 3× lượt chạy/evidence/nhiễu flaky cho mọi run.
# Lane này CHỈ thêm 2 engine phụ (--project=firefox|webkit); chromium do job `regression` lo.
cross-browser:
  stage: regression
  image: mcr.microsoft.com/playwright:v1.60.0-noble   # đổi tag khớp @playwright/test trong package.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: manual
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
  variables:
    PROJECT_OUTPUT_DIR: "outputs/ci"
    TASK_KEY: "CI-CROSS-BROWSER"
    RUN_ID: "xb-$CI_PIPELINE_ID"
    ALLOW_EMPTY: "1"                          # bỏ khi lane đã có spec promoted (0-test thành ĐỎ)
    CROSS_BROWSER: "1"                        # bật 2 project firefox-desktop + webkit-desktop
    # CROSS_BROWSER_GREP: "@cross-browser"    # BẬT khi suite lớn: engine phụ chỉ chạy tập critical
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    # webkit đã cần cho iphone-13 ở lane regression; FIREFOX chỉ cài Ở ĐÂY (đừng thêm vào lane PR).
    - npx playwright install firefox webkit
    # F1 — chống false-green, đếm ĐÚNG SCOPE 2 engine phụ (kể cả khi CROSS_BROWSER_GREP lọc bớt).
    - export SCOPE="$(npm run -s ci:scope -- --print-nightly)"; echo "scope = $SCOPE"
    - node scripts/qa/test_inventory_gate.js --out inventory-xb.json -- --project=firefox-desktop --project=webkit-desktop $SCOPE
    - |
      STATE=$(node -e "try{process.stdout.write(JSON.parse(require('fs').readFileSync('inventory-xb.json','utf8')).state)}catch(e){process.stdout.write('INFRA_FAILURE')}")
      echo "cross-browser inventory = $STATE"
      if [ "$STATE" = "HAS_TESTS" ]; then
        npx playwright test $SCOPE --project=firefox-desktop --project=webkit-desktop --reporter=html
      elif [ "$STATE" = "NO_TESTS" ]; then
        echo "NO_TESTS_EXECUTED — lane cross-browser rong (chua promote spec hoac GREP khong khop). KHONG phai PASSED."
      else
        echo "INFRA_FAILURE - playwright/config loi"; exit 1
      fi
  artifacts:
    when: always
    paths: [playwright-report/, inventory-xb.json]
    expire_in: 1 week

# ---- CHỨNG MINH NĂNG LỰC PHÁT HIỆN (nightly/manual) ----
# Vì sao là job RIÊNG và chạy định kỳ, không phải mỗi MR: nó tiêm lỗi rồi mở lại từng màn nên đắt (mỗi mutant =
# 1 lượt tải trang + settle), và mục tiêu của nó không phải bắt bug của lần push này mà **đo xem bộ kiểm có còn
# bắt được bug hay không**. Số đo lần đầu (19/08): máy kiểm-kê-field 0/4 · trục ② 3/4 — đó là mốc để so.
detection-proof:
  stage: regression
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: true            # đây là THƯỚC ĐO, không phải cổng chặn merge
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  variables:
    PROJECT_OUTPUT_DIR: "outputs/ci"
    TASK_KEY: "CI-DETECTION-PROOF"
    RUN_ID: "dp-$CI_PIPELINE_ID"
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npx playwright install chromium
    # Cần catalog + bindings của task thật; không có thì báo rõ là CHƯA ĐO ĐƯỢC, không im lặng xanh.
    - |
      CAT="${DETECTION_CATALOG:-}"
      if [ -z "$CAT" ] || [ ! -f "$CAT" ]; then
        echo "CHUA DO DUOC: thieu DETECTION_CATALOG (duong dan ui_catalog.json cua task). Day KHONG phai PASSED."
        exit 0
      fi
      npm run proof:nightly -- --catalog "$CAT" --out mutation-check.md
    # Ngưỡng: score TỤT so với mốc đã ghi thì phải biết ngay (đọc bằng dòng máy trong báo cáo).
    - |
      if [ -f mutation-check.md ]; then
        PROVEN=$(sed -n '1s/.*proven=\([0-9]*\).*/\1/p' mutation-check.md)
        echo "mutation: proven=$PROVEN (moc 19/08: may kiem-ke-field 0, truc (2) 3/4)"
      fi
  artifacts:
    when: always
    paths: [mutation-check.md]
    expire_in: 1 month

merge-report:
  stage: report
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  # Cùng điều kiện với regression (schedule/web); trên push cả 2 đều vắng → chỉ static-check chạy.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
  needs:
    - job: regression
      artifacts: true
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npx playwright merge-reports --reporter=html blob-report/ || echo "no blob to merge"
    # F11/F10 — thu KPI + reliability từ blob (merge JSON) → tích luỹ knowledge/metrics.
    - PLAYWRIGHT_JSON_OUTPUT_NAME=merged-results.json npx playwright merge-reports --reporter=json blob-report/ || echo "(no blob for json)"
    - node scripts/qa/metrics_collect.js --results merged-results.json --label "ci-$CI_PIPELINE_ID" || echo "(metrics skip)"
    - node scripts/qa/reliability_index.js || echo "(reliability skip)"
    # Persistence: KHÔNG commit-back vào repo nữa. `knowledge/**` đã bỏ track từ `2d383e1` (dữ liệu công
    # ty, đối xử như `.env`) ⇒ `git add knowledge/metrics/...` không stage được gì, mà vì có `|| true` +
    # `git diff --cached --quiet` nên job vẫn xanh và in "metrics khong doi": tính năng CHẾT mà trông như
    # bình thường. Ngắn hạn: KPI nằm ở artifact dưới đây. Dài hạn: `npm run knowledge:backup` ra
    # `KNOWLEDGE_BACKUP_DIR` (preflight cảnh báo khi chưa khai). Muốn lịch sử ngay trong CI thì phải dựng
    # backend ngoài repo — quyết định của chủ repo, không phải mặc định im lặng.
    - 'echo "(persistence) artifact-only: knowledge/ khong track => khong commit-back. Lich su dai han: npm run knowledge:backup"'
  artifacts:
    when: always
    paths: [playwright-report/, knowledge/metrics/]
    expire_in: 2 weeks
