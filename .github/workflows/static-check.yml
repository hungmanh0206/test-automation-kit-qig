# Static / quality check — chạy MỖI push & PR. KHÔNG cần secret, KHÔNG hit UAT.
# Bắt vỡ tooling của kit (script/JSON/schema) — đây là CI có giá trị thật ngay cả khi
# chưa có spec committed (kit là AI-agent-driven; regression thật để ci.yml nightly/manual).
name: static-check

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Preflight (G1 — config/context integrity, miss-file/PARSE_FAILURE = đỏ)
        run: npm run preflight

      - name: Syntax check (node --check toàn bộ script committed)
        run: |
          set -e
          find scripts -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
          find scripts -name '*.mjs' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
          echo "node --check OK"

      - name: JSON validity (mọi .json đang được track — danh sách viết tay đã từng đỏ oan)
        run: npm run json:check

      - name: Dependency có nơi dùng hoặc có lý do (dep dạng URL phải khai, lockfile phải có integrity)
        run: npm run deps:check

      - name: Rút gọn core_rules không được làm mất luật (mọi luật phải có con trỏ giải được)
        run: npm run rule:parity:enforce

      - name: Phạm vi CI (spec theo task không được track · nightly không chạm UAT)
        run: npm run ci:scope

      - name: Policy 1-nguồn (F3 — RULE_GLOBAL canonical, core_rules là digest có pointer)
        run: npm run gate:policy

      - name: Danh mục gate khớp source (bảng lệch = một gate đã đổi mức CHẶN/CẢNH BÁO mà không ai ghi)
        run: npm run gates:index:check

      # Ngân sách token cho hướng dẫn của chính kit. Ngưỡng ở .agent/config/prompt_budget.json, đo theo
      # lời khai bat_buoc trong load_map.json. Chốt chống trôi: tài liệu phình lại bằng cách mỗi lần
      # thêm vài dòng hợp lý, và không gì ghi lại việc đó.
      - name: Ngân sách token hướng dẫn (prompt:budget --enforce)
        run: npm run prompt:budget -- --enforce

      - name: INDEX.md khớp nguồn SKILL.md (artifact sinh trôi khỏi nguồn = không ai thấy)
        run: npm run skills:index:check

      # Trang docs/library/ và tài liệu hướng dẫn là lớp DẪN XUẤT: viết tay, nguồn thì đổi liên tục.
      # Trước đây gate này chỉ chạy khi có người NHỚ gõ lệnh — tức là nó chưa thật sự gác cổng.
      # Rẻ và tất định: chỉ đọc file trong repo, không cần môi trường ngoài.
      - name: Thư viện + tài liệu khớp repo (library:drift — số liệu, link bài, cú pháp mã trong bài giảng)
        run: npm run library:drift

      # Khối "Bộ kit của bạn đang ở đâu" là lớp DẪN XUẤT của docs/COURSE.md. Nó nhắc số bài, số cấp
      # độ và tên bài kế tiếp — toàn thứ đã đổi ba lần trong một tuần. Không có phép kiểm này thì nó
      # trôi khỏi giáo trình mà không ai biết.
      - name: Chỉ báo độ chín từng bài khớp giáo trình (course:maturity:check)
        run: npm run course:maturity:check

      # CHẠY sản phẩm thực hành rồi so con số. Ví dụ trụ cột ở Bài 1 từng lệch app ở năm chỗ và
      # không phép kiểm nào bắt, vì mọi phép kiểm cũ đọc văn bản.
      - name: Con số bài giảng khớp app thực hành (course:numbers)
        run: npm run course:numbers

      - name: Mục lục RULE_GLOBAL khớp nội dung (bảng tra sai = agent đọc sai khối luật)
        run: npm run rule -- --check

      - name: Secret scan (F7 — chặn nếu có secret commit trên file đã track)
        run: npm run secret:scan

      - name: npm audit (F7 — report advisory + CHẶN ở high/critical; đã vá 2 high, còn moderate uuid/exceljs)
        run: |
          # `npm audit` trần đã BỎ (04/09/2026): đo 74s, trùng dữ liệu với `audit:ci` (71s) ngay dưới.
          npm run audit:ci

      - name: Lint + typecheck (F7 — ENFORCED; baseline 0 error, CHẶN khi có lỗi mới)
        run: |
          npm run lint
          npm run typecheck

      - name: Safe dry-runs (không secret / không UAT)
        run: |
          set -e
          # Dashboard render trạng thái rỗng (knowledge/ live rỗng) — phải exit 0, không crash.
          npm run dashboard
          # Risk register cold-start (band từ Impact trong risk_model) — phải exit 0.
          npm run risk

      - name: Security guard phải TỪ CHỐI khi thiếu --confirm-nonprod
        run: |
          # security_check là never-auto: chạy không có --confirm-nonprod phải exit != 0 (không nã UAT).
          if node scripts/qa/security_check.js --catalog tests/fixtures/minimal_ui_catalog.json; then
            echo "LỖI: security_check KHÔNG được chạy khi thiếu --confirm-nonprod"; exit 1
          else
            echo "OK: security guard từ chối đúng"
          fi
