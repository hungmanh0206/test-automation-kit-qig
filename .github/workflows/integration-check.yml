# Integration check — MANUAL. Kiểm kết nối Backlog + DRY-RUN bug reporter.
# KHÔNG log bug thật (giữ human gate --qa-approved là hành động local).
# Confluence đã bỏ khỏi job này (22/09/2026, cùng lượt chuyển Jira→Backlog) — chờ quyết Google Docs/Sheet.
# Testcase publish (AIO Tests → Google Sheet, 22/09/2026) dùng Google Drive MCP — kênh riêng của phiên
# chat, KHÔNG gọi được từ script CLI/CI headless. Vì vậy job này KHÔNG còn bước dry-run publish testcase;
# muốn kiểm publish thì làm thủ công trong phiên chat (xem `.agent/workflows/phase1_04_auto_publish_jira.md`).
name: integration-check

on:
  workflow_dispatch:
    inputs:
      project_output_dir:
        description: 'PROJECT_OUTPUT_DIR (cho dry-run publish/bug, optional)'
        required: false
        default: ''
      task_key:
        description: 'TASK_KEY (optional — để dry-run publish/bug theo task)'
        required: false
        default: ''
      story_key:
        description: 'BACKLOG_STORY_KEY (optional)'
        required: false
        default: ''

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      BACKLOG_BASE_URL: ${{ secrets.BACKLOG_BASE_URL }}
      BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
      BACKLOG_PROJECT_KEY: ${{ secrets.BACKLOG_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci

      - name: Live connection check (Backlog)
        run: npm run integration:check:live

      - name: Dry-run bug reporter (KHÔNG log bug thật)
        if: ${{ inputs.task_key != '' && inputs.story_key != '' && inputs.project_output_dir != '' }}
        run: npm run backlog:bug-report:dry-run -- --project-output "${{ inputs.project_output_dir }}" --task "${{ inputs.task_key }}" --story "${{ inputs.story_key }}"
