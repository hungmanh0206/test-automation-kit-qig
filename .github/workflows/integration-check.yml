# Integration check — MANUAL. Kiểm kết nối Jira/Confluence/AIO Tests + DRY-RUN publish/bug.
# KHÔNG publish/log Jira thật (giữ human gate --qa-approved là hành động local).
name: integration-check

on:
  workflow_dispatch:
    inputs:
      project_output_dir:
        description: 'PROJECT_OUTPUT_DIR (cho dry-run publish/bug, optional)'
        required: false
        default: ''
      task_key:
        description: 'TASK_KEY (optional — để dry-run publish/bug theo task)'
        required: false
        default: ''
      story_key:
        description: 'JIRA_STORY_KEY (optional)'
        required: false
        default: ''

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_USERNAME: ${{ secrets.JIRA_EMAIL }}
      AIO_API_TOKEN: ${{ secrets.AIO_API_TOKEN }}
      AIO_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
      CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci

      - name: Live connection check (Jira/Confluence/AIO Tests)
        run: npm run integration:check:live

      # AIO là tool mặc định (GĐ5) ⇒ lệnh Xray cũ TỰ CHẶN, job sẽ đỏ nếu còn gọi. Publisher AIO nhận
      # --file nên phải tìm Excel canonical của task; không có file thì bỏ qua bước (không fail giả).
      - name: Dry-run publish testcase lên AIO (KHÔNG ghi thật)
        if: ${{ inputs.task_key != '' && inputs.story_key != '' && inputs.project_output_dir != '' }}
        run: |
          f=$(ls "${{ inputs.project_output_dir }}/tasks/${{ inputs.task_key }}/test-cases/"*.xlsx 2>/dev/null | head -1)
          if [ -z "$f" ]; then echo "Bỏ qua: không thấy Excel canonical trong test-cases/"; exit 0; fi
          npm run aio:publish -- --file "$f" --story "${{ inputs.story_key }}"

      - name: Dry-run bug reporter (KHÔNG log bug thật)
        if: ${{ inputs.task_key != '' && inputs.story_key != '' && inputs.project_output_dir != '' }}
        run: npm run jira:bug-report:dry-run -- --project-output "${{ inputs.project_output_dir }}" --task "${{ inputs.task_key }}" --story "${{ inputs.story_key }}"
